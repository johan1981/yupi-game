<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1450" viewBox="0 0 2400 1450">
  <rect width="2400" height="1450" fill="#f8f9fb"/>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#222}
    .navy{fill:#15304e}
    .muted{fill:#5c626c}
    .title{font-size:62px;font-weight:700}
    .sub{font-size:30px}
    .section{font-size:34px;font-weight:700}
    .label{font-size:27px;font-weight:700}
    .body{font-size:28px}
    .small{font-size:24px}
    .card{fill:#fff;stroke:#d8dce1;stroke-width:3}
    .light{fill:#f2f5f8}
    .green{fill:#1c9652}
  </style>

  <text x="80" y="100" class="t navy title">YUPI PUP — ASSETREGISTRATIE</text>
  <text x="80" y="155" class="t muted sub">Goedgekeurde registratielay-out — gebaseerd op de bestaande canonieke base-reference.</text>

  <rect x="80" y="210" width="1290" height="1130" rx="34" class="card"/>
  <rect x="120" y="250" width="1210" height="875" rx="24" fill="#fafafa"/>
  <image x="150" y="275" width="1150" height="820" preserveAspectRatio="xMidYMid meet" href="../design/approved/base-reference.jpg" xlink:href="../design/approved/base-reference.jpg"/>

  <rect x="120" y="1145" width="1210" height="150" rx="24" class="light"/>
  <text x="155" y="1205" class="t navy label">CANONIEKE BRON</text>
  <text x="155" y="1255" class="t body">assets/yupi/pup/design/approved/base-reference.jpg</text>

  <rect x="1420" y="210" width="900" height="350" rx="32" class="card"/>
  <text x="1465" y="270" class="t navy section">REPO-GEGEVENS</text>
  <text x="1465" y="335" class="t muted label">Status</text>
  <text x="1695" y="335" class="t body">approved</text>
  <text x="1465" y="385" class="t muted label">Asset-ID</text>
  <text x="1695" y="385" class="t body">yupi-pup-design-base</text>
  <text x="1465" y="435" class="t muted label">Form</text>
  <text x="1695" y="435" class="t body">pup</text>
  <text x="1465" y="485" class="t muted label">Spec</text>
  <text x="1695" y="485" class="t body">YUPI_SPEC.json v1.1.0</text>
  <text x="1465" y="535" class="t muted label">Manifest</text>
  <text x="1695" y="535" class="t body">asset-manifest.json</text>

  <rect x="1420" y="595" width="900" height="355" rx="32" class="card"/>
  <text x="1465" y="655" class="t navy section">HARD ANATOMY GATE</text>

  <g class="t body">
    <circle cx="1483" cy="720" r="18" class="green"/><text x="1474" y="730" fill="#fff" font-size="24" font-weight="700">✓</text><text x="1520" y="730">Exact 3 poten</text>
    <circle cx="1483" cy="768" r="18" class="green"/><text x="1474" y="778" fill="#fff" font-size="24" font-weight="700">✓</text><text x="1520" y="778">Rechter voorpoot aanwezig</text>
    <circle cx="1483" cy="816" r="18" class="green"/><text x="1474" y="826" fill="#fff" font-size="24" font-weight="700">✓</text><text x="1520" y="826">Linker voorpoot weg tot schouder</text>
    <circle cx="1483" cy="864" r="18" class="green"/><text x="1474" y="874" fill="#fff" font-size="24" font-weight="700">✓</text><text x="1520" y="874">Beide achterpoten aanwezig</text>
    <circle cx="1483" cy="912" r="18" class="green"/><text x="1474" y="922" fill="#fff" font-size="24" font-weight="700">✓</text><text x="1520" y="922">Rechter oor staat — linker oor hangt</text>
  </g>

  <rect x="1420" y="985" width="900" height="355" rx="32" class="card"/>
  <text x="1465" y="1045" class="t navy section">WERKWIJZE</text>

  <g class="t body">
    <circle cx="1488" cy="1110" r="23" class="navy"/><text x="1480" y="1120" fill="#fff" font-size="27" font-weight="700">1</text><text x="1535" y="1120">Repo + JSON lezen</text>
    <circle cx="1488" cy="1160" r="23" class="navy"/><text x="1480" y="1170" fill="#fff" font-size="27" font-weight="700">2</text><text x="1535" y="1170">Los aanzicht maken</text>
    <circle cx="1488" cy="1210" r="23" class="navy"/><text x="1480" y="1220" fill="#fff" font-size="27" font-weight="700">3</text><text x="1535" y="1220">Visueel tegen JSON controleren</text>
    <circle cx="1488" cy="1260" r="23" class="navy"/><text x="1480" y="1270" fill="#fff" font-size="27" font-weight="700">4</text><text x="1535" y="1270">Fout? Niet tonen / niet vastleggen</text>
    <circle cx="1488" cy="1310" r="23" class="navy"/><text x="1480" y="1320" fill="#fff" font-size="27" font-weight="700">5</text><text x="1535" y="1320">Goed? Na ‘vastleggen’ naar repo</text>
  </g>

  <rect x="80" y="1365" width="2240" height="55" rx="18" class="navy"/>
  <text x="1200" y="1402" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">
    EERST REPO → DAN ANATOMIE → DAN GENEREREN → DAN VALIDEREN → PAS DAN VASTLEGGEN
  </text>
</svg>