<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<title>Yupi — echte beweging test V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden;background:#fff}
#yupi{position:absolute;left:120px;bottom:60px;width:220px;height:220px;object-fit:contain;object-position:center bottom;transform-origin:50% 100%;user-select:none;-webkit-user-drag:none}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:10}
.badge{padding:8px 12px;border-radius:12px;background:#f2f2f2;border:1px solid #d8d8d8;font-weight:800;font-size:13px;color:#333}
#refBtn{pointer-events:auto;border:1px solid #cfcfcf;background:#fff;color:#222;border-radius:12px;padding:9px 12px;font-weight:900;font-size:12px}
#refOverlay{display:none;position:absolute;inset:0;z-index:50;background:rgba(255,255,255,.97);align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#refOverlay.open{display:flex}
#refOverlay img{max-width:96vw;max-height:92vh;object-fit:contain}
#closeRef{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:24px;font-weight:900}
#touch{position:absolute;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;z-index:20}
.move{display:flex;gap:12px}
.tbtn{width:76px;height:76px;border-radius:22px;border:1px solid #cfcfcf;background:#f7f7f7;color:#222;font-size:30px;font-weight:900;touch-action:none}
.rotate{display:none;position:absolute;inset:0;z-index:30;background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;font-weight:800;color:#222}
@media (orientation:portrait) and (max-width:900px){.rotate{display:flex}}
@media (pointer:fine){#touch{display:none}}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="badge">YUPI V3 · VIDEO-REFERENTIE</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="badge">ECHTE LOOPTEST</div>
      <button id="refBtn" type="button">V2 SHEET</button>
    </div>
  </div>

  <img id="yupi" src="./assets/yupi/pup/walk8-headbob/idle-aligned.png" alt="Pup Yupi">
  <div id="refOverlay" aria-hidden="true">
    <button id="closeRef" type="button" aria-label="Sluiten">×</button>
    <img src="./assets/yupi/pup/design/yupi-v2-approved-sheet.png" alt="Goedgekeurde Yupi v2 character sheet">
  </div>

  <div id="touch">
    <div class="move">
      <button id="left" class="tbtn" aria-label="Links">◀</button>
      <button id="right" class="tbtn" aria-label="Rechts">▶</button>
    </div>
    <div class="move" style="margin-left:auto">
      <button id="walkMode" class="tbtn" style="font-size:11px">WANDEL</button>
      <button id="trotMode" class="tbtn" style="font-size:11px">DRAF</button>
      <button id="sprintMode" class="tbtn" style="font-size:11px">SPRINT</button>
    </div>
  </div>

  <div class="rotate">↻<br><br>Draai je iPhone horizontaal</div>
</div>

<script>
(()=>{
const yupi=document.getElementById("yupi");
const refBtn=document.getElementById("refBtn");
const refOverlay=document.getElementById("refOverlay");
const closeRef=document.getElementById("closeRef");
refBtn.addEventListener("click",()=>{refOverlay.classList.add("open");refOverlay.setAttribute("aria-hidden","false")});
closeRef.addEventListener("click",()=>{refOverlay.classList.remove("open");refOverlay.setAttribute("aria-hidden","true")});
refOverlay.addEventListener("click",e=>{if(e.target===refOverlay){refOverlay.classList.remove("open");refOverlay.setAttribute("aria-hidden","true")}});

const idle="./assets/yupi/pup/walk8-headbob/idle-aligned.png";
const walk=Array.from({length:8},(_,i)=>"./assets/yupi/pup/walk8-video/frame-0"+i+".png");
[idle,...walk].forEach(src=>{const img=new Image();img.src=src});

const modeCfg={
  walk:{speed:180,fps:7.2,bob:1.0},
  trot:{speed:285,fps:10.2,bob:1.35},
  sprint:{speed:420,fps:13.4,bob:1.65}
};
const bob=[0,2,5,7,4,0,-3,-1];
const tilt=[0,.4,.9,.35,-.35,-.75,-.45,0];

let x=120,dir=1,last=0,frame=0,phase=0,velocity=0,mode="walk",turnKick=0;
const keys={};
const touch={l:0,r:0};
const YUPI_W=220;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setMode(m){mode=m}
document.getElementById("walkMode").addEventListener("click",()=>setMode("walk"));
document.getElementById("trotMode").addEventListener("click",()=>setMode("trot"));
document.getElementById("sprintMode").addEventListener("click",()=>setMode("sprint"));

function bind(id,key){
  const btn=document.querySelector(id);
  btn.addEventListener("pointerdown",e=>{e.preventDefault();touch[key]=1;btn.setPointerCapture?.(e.pointerId)});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,()=>touch[key]=0));
}
bind("#left","l");bind("#right","r");

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();keys[k]=1;
  if(k==="1")setMode("walk");
  if(k==="2")setMode("trot");
  if(k==="3")setMode("sprint");
  if(k==="arrowleft"||k==="arrowright")e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);

function update(dt){
  const left=keys["arrowleft"]||keys["a"]||touch.l;
  const right=keys["arrowright"]||keys["d"]||touch.r;
  const input=(right?1:0)-(left?1:0);
  const nextDir=input?Math.sign(input):dir;
  if(input && nextDir!==dir){dir=nextDir;turnKick=.15}
  turnKick=Math.max(0,turnKick-dt);

  const cfg=modeCfg[mode];
  const target=input*cfg.speed;
  velocity+=(target-velocity)*Math.min(1,dt*(input?7:10));
  if(!input&&Math.abs(velocity)<4)velocity=0;

  x+=velocity*dt;
  x=clamp(x,0,Math.max(0,innerWidth-YUPI_W));

  const moving=Math.abs(velocity)>8;
  if(moving){
    phase=(phase+dt*cfg.fps)%8;
    frame=Math.floor(phase);
    yupi.src=walk[frame];
    const vertical=bob[frame]*cfg.bob;
    const shoulder=(frame===2||frame===3)?-.8:(frame===5?.45:0);
    const rot=(tilt[frame]+shoulder)*dir+(turnKick?dir*2.3:0);
    yupi.style.transform="scaleX("+dir+") translateY("+vertical+"px) rotate("+rot+"deg)";
  }else{
    phase=0;frame=0;yupi.src=idle;
    yupi.style.transform="scaleX("+dir+")";
  }
  yupi.style.left=x+"px";
}

function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
