<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<title>Yupi — Sprite test</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden;background:#fff}
#yupi{position:absolute;left:120px;bottom:60px;width:220px;height:220px;object-fit:contain;object-position:center bottom;transform-origin:50% 100%;user-select:none;-webkit-user-drag:none}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.badge{padding:8px 12px;border-radius:12px;background:#f2f2f2;border:1px solid #d8d8d8;font-weight:800;font-size:13px;color:#333}
#touch{position:absolute;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;z-index:20}
.move{display:flex;gap:12px}
.tbtn{width:76px;height:76px;border-radius:22px;border:1px solid #cfcfcf;background:#f7f7f7;color:#222;font-size:30px;font-weight:900;touch-action:none}
.rotate{display:none;position:absolute;inset:0;z-index:30;background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;font-weight:800;color:#222}
@media (orientation:portrait) and (max-width:900px){.rotate{display:flex}}
@media (pointer:fine){#touch{display:none}}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="badge">PUP YUPI</div>
    <div class="badge">VIDEO-REFERENCE WALK TEST</div>
  </div>

  <img id="yupi" src="./assets/yupi/pup/idle.png" alt="Pup Yupi">

  <div id="touch">
    <div class="move">
      <button id="left" class="tbtn" aria-label="Links">◀</button>
      <button id="right" class="tbtn" aria-label="Rechts">▶</button>
    </div>
  </div>

  <div class="rotate">↻<br><br>Draai je iPhone horizontaal</div>
</div>

<script>
(()=>{
const yupi=document.getElementById("yupi");
const idle="./assets/yupi/pup/idle.png";
const walk=[
  "./assets/yupi/pup/walk8-video/frame-00.png",
  "./assets/yupi/pup/walk8-video/frame-01.png",
  "./assets/yupi/pup/walk8-video/frame-02.png",
  "./assets/yupi/pup/walk8-video/frame-03.png",
  "./assets/yupi/pup/walk8-video/frame-04.png",
  "./assets/yupi/pup/walk8-video/frame-05.png",
  "./assets/yupi/pup/walk8-video/frame-06.png",
  "./assets/yupi/pup/walk8-video/frame-07.png"
];
[idle,...walk].forEach(src=>{const img=new Image();img.src=src});

let x=120,dir=1,last=0,frame=0,frameTime=0;
const keys={};
const touch={l:0,r:0};
const SPEED=260;
const YUPI_W=220;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function bind(id,key){
  const btn=document.querySelector(id);
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    touch[key]=1;
    btn.setPointerCapture?.(e.pointerId);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
    btn.addEventListener(ev,()=>touch[key]=0);
  });
}
bind("#left","l");
bind("#right","r");

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  keys[k]=1;
  if(k==="arrowleft"||k==="arrowright")e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);

function update(dt){
  const left=keys["arrowleft"]||keys["a"]||touch.l;
  const right=keys["arrowright"]||keys["d"]||touch.r;
  const move=(right?1:0)-(left?1:0);
  const walking=move!==0;

  if(move){
    dir=move;
    x+=move*SPEED*dt;
    x=clamp(x,0,Math.max(0,innerWidth-YUPI_W));
    frameTime+=dt;
    if(frameTime>.09){
      frameTime=0;
      frame=(frame+1)%walk.length;
    }
  }else{
    frame=0;
    frameTime=0;
  }

  yupi.src=walking?walk[frame]:idle;
  yupi.style.left=x+"px";
  yupi.style.transform=dir<0?"scaleX(-1)":"scaleX(1)";
}

function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);
  last=t;
  update(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
