<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111d">
<link rel="manifest" href="./manifest.webmanifest">
<title>Yupi — Looptest</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
.screen{position:fixed;inset:0}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#173450,#06101a 70%);z-index:20}
#start.hide{display:none}
.logo{font-size:clamp(48px,13vw,112px);font-weight:1000;letter-spacing:.08em;line-height:.9;text-shadow:0 0 28px #4de8ff77}
.sub{margin-top:14px;color:#6ee7ff;font-weight:900;letter-spacing:.22em}
p{max-width:650px;color:#bdd0dd}
button{font:inherit}
.primary{margin-top:18px;padding:16px 24px;border-radius:16px;border:1px solid #79eaff;color:#fff;background:linear-gradient(135deg,#0f8cae,#7d42bd);font-size:18px;font-weight:900}
#game{background:#0b1721}
#viewport{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:2200px;height:100%;will-change:transform}
.sky{position:absolute;inset:0;background:linear-gradient(#8fd4ec 0%,#cbeff4 48%,#8aa8ad 100%)}
.cityFar,.cityNear{position:absolute;left:0;right:0;bottom:34%;height:50%;opacity:.35;pointer-events:none}
.cityFar{background:
linear-gradient(90deg,transparent 0 4%,#507587 4% 9%,transparent 9% 13%,#456879 13% 20%,transparent 20% 25%,#618798 25% 31%,transparent 31% 38%,#456879 38% 45%,transparent 45% 52%,#507587 52% 59%,transparent 59% 65%,#618798 65% 72%,transparent 72% 78%,#456879 78% 84%,transparent 84% 100%);filter:blur(3px)}
.cityNear{bottom:27%;height:36%;opacity:.22;background:
repeating-linear-gradient(90deg,#274451 0 80px,transparent 80px 155px);filter:blur(1px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:31%;background:linear-gradient(#526066,#2b363b 18%,#1c272c 100%);border-top:8px solid #7d9198}
.floor:after{content:"";position:absolute;left:0;right:0;top:34%;height:5px;background:repeating-linear-gradient(90deg,#8ec7d4 0 80px,transparent 80px 150px);opacity:.35}
.crate{position:absolute;bottom:31%;width:120px;height:100px;border:5px solid #24343a;background:linear-gradient(135deg,#7b6044,#4f3d2e);box-shadow:inset 0 0 0 6px #907457,0 12px 22px #0006}
.crate:before,.crate:after{content:"";position:absolute;background:#283a3f}
.crate:before{left:10%;right:10%;top:45%;height:7px}.crate:after{top:10%;bottom:10%;left:47%;width:7px}
#yupi{position:absolute;left:180px;bottom:27%;width:220px;height:220px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 10px #0005);transform-origin:50% 100%;will-change:left,transform}
#hud{position:absolute;z-index:8;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}
.badge{padding:8px 12px;border-radius:12px;background:#07131fe8;border:1px solid #345369;font-weight:900;font-size:13px}
#touch{position:absolute;z-index:9;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between}
.move{display:flex;gap:12px}
.tbtn{width:76px;height:76px;border-radius:22px;border:1px solid #6ee7ff88;background:#0a2032cc;color:#fff;font-size:30px;font-weight:1000;touch-action:none}
#finish{position:absolute;right:120px;bottom:31%;width:5px;height:190px;background:#70e8ff;box-shadow:0 0 24px #70e8ff}
#finishLabel{position:absolute;right:48px;bottom:calc(31% + 200px);padding:7px 10px;border-radius:10px;background:#07131fd9;color:#bfefff;font-weight:900;font-size:12px;letter-spacing:.08em}
#message{position:absolute;z-index:10;left:50%;top:18%;transform:translateX(-50%);background:#07131fe8;border:1px solid #50728a;border-radius:14px;padding:10px 16px;font-weight:850;opacity:0;transition:.2s;pointer-events:none}
#message.show{opacity:1}
.rotate{display:none;position:absolute;inset:0;z-index:30;background:#050b12;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;font-weight:800}
@media (orientation:portrait) and (max-width:900px){.rotate{display:flex}}
@media (pointer:fine){#touch{display:none}}
</style>
</head>
<body>
<section id="start" class="screen">
  <div class="logo">YUPI</div>
  <div class="sub">PUP YUPI — LOOPTEST</div>
  <p>Een eerste klein stukje van Level 1. Alleen lopen, zodat we eerst beweging, schaal en cameragedrag goed krijgen.</p>
  <button id="startBtn" class="primary">START LOOPTEST</button>
</section>

<section id="game" class="screen">
  <div id="viewport">
    <div id="world">
      <div class="sky"></div>
      <div class="cityFar"></div>
      <div class="cityNear"></div>
      <div class="floor"></div>
      <div class="crate" style="left:720px"></div>
      <div class="crate" style="left:1180px;width:150px;height:75px"></div>
      <div class="crate" style="left:1580px;width:100px;height:130px"></div>
      <div id="finish"></div>
      <div id="finishLabel">EINDE LOOPTEST</div>
      <img id="yupi" src="./assets/yupi/pup/idle.png" alt="Pup Yupi">
    </div>
  </div>
  <div id="hud"><div class="badge">LEVEL 1 — DE LAATSTE RIT</div><div class="badge">LOOPTEST</div></div>
  <div id="message"></div>
  <div id="touch"><div class="move"><button id="left" class="tbtn">◀</button><button id="right" class="tbtn">▶</button></div></div>
  <div class="rotate">↻<br><br>Draai je iPhone horizontaal om Yupi te spelen.</div>
</section>

<script>
(()=>{
const yupi=document.querySelector("#yupi"),world=document.querySelector("#world"),start=document.querySelector("#start"),msg=document.querySelector("#message");
const idle="./assets/yupi/pup/idle.png";
const walk=["./assets/yupi/pup/walk-01.png","./assets/yupi/pup/walk-02.png"];
walk.concat(idle).forEach(src=>{const i=new Image();i.src=src});
let x=180,dir=1,walking=false,last=0,frameTime=0,frame=0,cam=0,keys={},touch={l:0,r:0},started=false,done=false;
const WORLD_W=2200,YUPI_W=220,SPEED=245;

function show(t){msg.textContent=t;msg.classList.add("show");clearTimeout(show.t);show.t=setTimeout(()=>msg.classList.remove("show"),1400)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function bind(id,k){
 const b=document.querySelector(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();touch[k]=1;b.setPointerCapture?.(e.pointerId)});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>touch[k]=0));
}
bind("#left","l");bind("#right","r");
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==="arrowleft"||k==="arrowright")e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
document.querySelector("#startBtn").onclick=()=>{start.classList.add("hide");started=true;show("Loop naar rechts →")};

function update(dt){
 if(!started)return;
 const left=keys["arrowleft"]||keys["a"]||touch.l;
 const right=keys["arrowright"]||keys["d"]||touch.r;
 const move=(right?1:0)-(left?1:0);
 walking=move!==0;
 if(move){
   dir=move;
   x+=move*SPEED*dt;
   x=clamp(x,50,WORLD_W-YUPI_W-40);
   frameTime+=dt;
   if(frameTime>.16){frameTime=0;frame=(frame+1)%walk.length}
 } else {frame=0;frameTime=0}
 yupi.src=walking?walk[frame]:idle;
 yupi.style.left=x+"px";
 yupi.style.transform=dir<0?"scaleX(-1)":"scaleX(1)";
 const vw=innerWidth;
 const desired=x-vw*.38;
 cam=clamp(desired,0,Math.max(0,WORLD_W-vw));
 world.style.transform="translate3d("+(-cam)+"px,0,0)";
 if(!done&&x>1880){done=true;show("Mooi — einde van de looptest")}
}

function loop(t){
 const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
