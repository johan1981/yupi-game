name: Recover Teen Yupi head crops

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yupi-recover-teen-heads.yml"
      - "scripts/recover_yupi_teen_heads.py"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/recover_yupi_teen_heads.py
      - name: Commit exact recovered crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/yupi/teen/expressions/head/happy.png
          git add assets/yupi/teen/expressions/head/sad.png
          git add assets/yupi/teen/expressions/head/angry.png
          git add assets/yupi/teen/expressions/head/surprised.png
          git add assets/yupi/teen/expressions/head/scared.png
          git add assets/yupi/teen/expressions/head/determined.png
          git add assets/yupi/teen/expressions/head/curious.png
          git add assets/yupi/teen/expressions/head/playful.png
          if git diff --cached --quiet; then
            echo "Exact Teen head crops already present."
          else
            git commit -m "Restore exact Teen Yupi head expression crops"
            git push origin HEAD:main
          fi
