name: Yupi asset validation

on:
  push:
    paths:
      - "assets/yupi/**"
      - "scripts/validate_yupi_assets.py"
      - "docs/YUPI_ASSET_PIPELINE.md"
  pull_request:
    paths:
      - "assets/yupi/**"
      - "scripts/validate_yupi_assets.py"
      - "docs/YUPI_ASSET_PIPELINE.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_yupi_assets.py
